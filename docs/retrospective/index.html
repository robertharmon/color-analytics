document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"14380d4a-19eb-4d5b-9090-9ca3ca7a585d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  body { margin: 0; background: #f6f8fa; }\n  a { color: #0969da; text-decoration: none; }\n  a:hover { text-decoration: underline; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#f6f8fa; min-height:100vh; padding:24px 16px 64px; font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; color:#1f2328; -webkit-font-smoothing:antialiased;\">\n  <article style=\"max-width:720px; margin:0 auto; background:#ffffff; border:1px solid #d0d7de; border-radius:6px; padding:40px 48px 56px;\">\n\n    <h1 style=\"font-size:30px; font-weight:600; line-height:1.25; margin:0 0 4px; padding:0 0 10px; border-bottom:1px solid #d8dee4; letter-spacing:-0.01em;\">Athletic Apparel Color Analytics<\u002Fh1>\n    <p style=\"font-size:17px; line-height:1.55; color:#59636e; font-style:italic; margin:14px 0 28px; text-wrap:pretty;\">Measuring how five sportswear giants use color across 340,000 products— navigating the challenges involved in extracting reliable color data from product images, and rendering the total distribution in a single, unoccluded view.<\u002Fp>\n\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">In design and fashion, the idea that brands must stand out is pervasive. This assumption shapes the industry’s creative dialogue, leading to seasonal palettes, colors of the year, and trend forecasts. Blending in is considered a failure.<\u002Fp>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">This project sought to test whether this intuition held up to empirical scrutiny. The goal was to create a visualization tool that could help with answering a question: <strong style=\"font-weight:600;\">When it comes to the color used in actual products on the shelf, do major sportswear brands in the US differentiate themselves? If so, how?<\u002Fstrong><\u002Fp>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 24px; text-wrap:pretty;\">The tool ingests data from the five market leading brands in the US: <strong style=\"font-weight:600;\">Nike, Adidas, Puma, Lululemon, and Under Armour<\u002Fstrong>. Over a 16-month period, roughly 1M product listing instances were scraped, capturing images, list prices, and other product data.<\u002Fp>\n\n    <sc-raw-table style=\"border-collapse:collapse; width:100%; margin:0 0 24px; border:1px solid #d0d7de; table-layout:fixed;\">\n      <sc-raw-tbody>\n        <sc-raw-tr>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; background:#f6f8fa; font-weight:600; width:42%; vertical-align:top;\">Brands Analyzed<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">Nike, Adidas, Puma, Lululemon, Under Armour<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; background:#f6f8fa; font-weight:600; vertical-align:top;\">Raw Dataset Volume<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">~1M Product Instances<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; background:#f6f8fa; font-weight:600; vertical-align:top;\">Visualized Dataset Volume<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">~340,000 Product Instances<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; background:#f6f8fa; font-weight:600; vertical-align:top;\">Longitudinal Window<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">16 Months<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; background:#f6f8fa; font-weight:600; vertical-align:top;\">Data Segments<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">10 distinct brand × gender segments<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Answering the core research question meant building a pipeline that extracts colors from product photos, groups them into perceptually coherent clusters, and visualizes the results in a single “at a glance” view. This is an engineering case study of the hurdles encountered along the way.<\u002Fp>\n\n    <h2 style=\"font-size:22px; font-weight:600; line-height:1.3; margin:44px 0 16px; padding:0 0 8px; border-bottom:1px solid #d8dee4; text-wrap:pretty;\">1. Image Pre-Processing: Isolating Garments from Raw Studio Photos<\u002Fh2>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">The pipeline routes raw images through a YOLOv11 segmentation model fine-tuned on the Fashionpedia dataset to strip away non-product pixels like human models, backgrounds, and props.<\u002Fp>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Isolating the Primary Garment with Target-Class Filtering<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">The model’s job is to detect and segment all garments in the image, including the secondary garments worn by the studio model alongside the actual item being sold: of all the segmented garments in the frame, which one is the target product?<\u002Fp>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">This is solved by a per-brand keyword dictionary that parses product titles, mapping various keywords to Fashionpedia classes. A product title containing \"windbreaker\" or \"hoodie\" might be mapped to the Fashionpedia class called “top”.<\u002Fp>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">To test dictionary completeness across the full dataset, regex-inversion queries were executed to surface all titles the current keyword map failed to catch. An iterative feedback loop—skimming the unmapped residual, patching the dictionary with missing terms, and re-running the query— steadily shrunk the unmapped volume.<\u002Fp>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Final coverage landed between 80% and 95% depending on the brand, with Puma peaking at 95.4% and Lululemon lowest at 80.3%. This workflow only measures vocabulary recognition; it proves the dictionary catches the terms the brands use, but does not validate whether they route to the correct Fashionpedia class downstream.<\u002Fp>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Sometimes, more than one segmentation survives the keyword mapping step. The system then executes a largest bounding-box heuristic on the remaining masks. If a shirt and a jacket are both detected, the pipeline promotes the largest as the primary garment.<\u002Fp>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Reassembling Multi-Part Garments via Spatial Intersection<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">The Fashionpedia annotation schema treats garments as modular assemblies. A long-sleeve hoodie, for example, produces one top detection for the main torso, but separate, isolated detections for the sleeves, collar, or hood. If pixels are extracted from only the base torso class, parts of the garment—like a jacket with black sleeves and a white body—would drop out of the color analysis completely.<\u002Fp>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">To rebuild the full item, the pipeline executes a multi-stage Attribute Merge Step. Any secondary component mask is merged into the primary garment mask if it meets either of two simple spatial conditions:<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Bounding-Box IoU &gt; 0.15:<\u002Fstrong> The bounding boxes of the sleeve and the torso share at least a 15% overlap.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Mask Overlap &gt; 10% after Dilation:<\u002Fstrong> The torso mask is inflated using a 15x15 square kernel, roughly seven pixels in every direction. If the sleeve mask overlaps this expanded torso mask by more than 10% of its own area, they are stitched together.<\u002Fli>\n    <\u002Ful>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Any detections under a hard 50-pixel floor are discarded. Both this floor and the overlap ratio are measured in the model's downsampled mask space rather than original-image pixels, so the effective real-world threshold is somewhat larger than the raw numbers suggest.<\u002Fp>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Removing “Heraldic” Products via String-Matching<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Team-branded merchandise is a common feature in sportswear catalogs. Adidas sells Real Madrid jerseys; Nike sells Lakers shorts. Because these products do not reflect a proprietary color strategy, a strict pre-inference “Heraldic” Filter removes them. Product titles are checked against a compiled string-matching array containing:<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\">All active rosters across the NFL, NBA, MLB, and European soccer leagues.<\u002Fli>\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\">Top 200 US cities by population and all major US college/NCAA conference names.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\">Olympic country codes and geographic identifiers.<\u002Fli>\n    <\u002Ful>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">If a title hits any term in this repository, it is dropped. In validation testing against an 800-product hand-labeled sample – drawn across all five brands and sized for a ±5-point margin at 95% confidence under a conservative p = 0.5 assumption – the filter achieved a 95.6% recall rate (95% CI [92.9%, 97.3%]).<\u002Fp>\n\n    <h2 style=\"font-size:22px; font-weight:600; line-height:1.3; margin:44px 0 16px; padding:0 0 8px; border-bottom:1px solid #d8dee4; text-wrap:pretty;\">2. Color Extraction: Building a Palette for Each Garment<\u002Fh2>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">For every isolated garment, the underlying RGB pixels are extracted and converted to CIE LAB color coordinates. LAB is explicitly designed for spatial uniformity—the goal being that a given Euclidean distance represents the same perceived rate of color change regardless of locale.<\u002Fp>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">A local K-Means clustering algorithm (K = 5) runs on these LAB pixel coordinates. The garment's pixels are iteratively partitioned into five distinct centroids, returning two outputs for each cluster: a 3D coordinate vector representing the average color (L, a, b) and a float representing the percentage of the garment those pixels cover.<\u002Fp>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Collapsing Lighting Artifacts<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Because fabric folds inherently introduce highlights and shadows, raw K-means over-segments a single-color fabric into multiple clusters. These lighting artifacts need to be collapsed back into a single color. Using a simple hue-based similarity threshold to merge these clusters fails in two ways:<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">White and black merge:<\u002Fstrong> Pure white and pure black both possess near-zero chroma (saturation). Because their positions on the color wheel are mathematically ambiguous, a naive hue-check treated them as the same color, merging a white shirt's fabric with its black logo, for example.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Over-merging similar colors:<\u002Fstrong> Because a pure hue-merge ignores how light or dark a color is, the pipeline was merging distinct shades too aggressively. For example, royal blue and deep navy share a nearly identical hue angle, but they are distinctly different product offerings on a store shelf.<\u002Fli>\n    <\u002Ful>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">A chroma-gated merge rule solves the problem by branching the merge decision on saturation. The rule was informed by a ground-truth dataset including 300 hand-labeled Nike products—a baseline sized to yield a ±4% margin of error with an even allocation of 60 samples across each color archetype. Because each product maps to 5 clusters, this generates 3,000 pairwise comparisons— enough statistical power to run a rigorous threshold grid sweep. The optimization ultimately led to the implementation of a Lightness Guard inside the intra-product merge logic.<\u002Fp>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Two extracted clusters are now collapsed into a single color if they satisfy a dual-conditional threshold based on their Chroma and Lightness:<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Achromatic Condition:<\u002Fstrong> If both clusters are low-saturation neutrals (Chroma &lt; 5.0), they are only merged if their Lightness difference is less than 12.0 units. This acts as the Lightness Guard, preventing black and white from merging.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Chromatic Condition:<\u002Fstrong> Colorful clusters are only merged if they pass a tight distance floor—requiring an overall CIEDE2000 color distance of less than 8.0 units and a Lightness difference of less than 20.0 units.<\u002Fli>\n    <\u002Ful>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Integrating this Lightness guard pushed pair-level accuracy from 90.9% to 94.7% against the validation set. More importantly, it provided peace of mind that cluster merging was working properly.<\u002Fp>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Scope Reduction: Cutting Out Multi-Color Analysis<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">An early area of investigation focused on how brands structure their color choices. How often are products solid colored, incorporate secondary accents, or involve bold combinations of several colors? What color combinations are the most common? Are any combinations unique to a particular brand? This led to a classification system consisting of five distinct archetypes.<\u002Fp>\n\n    <sc-raw-table style=\"border-collapse:collapse; width:100%; margin:0 0 16px; border:1px solid #d0d7de; table-layout:fixed;\">\n      <sc-raw-thead>\n        <sc-raw-tr>\n          <sc-raw-th style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; background:#f6f8fa; font-weight:600; text-align:left; width:22%;\">Archetype<\u002Fsc-raw-th>\n          <sc-raw-th style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; background:#f6f8fa; font-weight:600; text-align:left; width:28%;\">Meaning<\u002Fsc-raw-th>\n          <sc-raw-th style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; background:#f6f8fa; font-weight:600; text-align:left;\">Classification Rule<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\">MONO<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">Essentially one solid color<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">0 or 1 significant cluster remains after merging<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\">DOM_ACC<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">Dominant color with small accent(s)<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">2 clusters where the dominant is ≥ 2× the secondary's coverage, OR 3+ clusters where all secondaries combined cover &lt; 10%<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\">DUAL_BAL<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">Two balanced colors<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">2 clusters where the dominant is &lt; 2× the secondary<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\">MULTI_DOM<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">Multiple colors, one dominant<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">3+ significant clusters, dominant covers ≥ 50%<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\">MULTI_BAL<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">Multiple balanced colors<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border:1px solid #d0d7de; padding:9px 13px; font-size:14px; line-height:1.5; vertical-align:top;\">3+ significant clusters, dominant covers &lt; 50%<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <p style=\"font-size:14px; line-height:1.55; margin:0 0 20px; padding:12px 16px; background:#f6f8fa; border-left:4px solid #656d76; border-radius:0 6px 6px 0; color:#424a53; text-wrap:pretty;\"><strong style=\"font-weight:600; color:#1f2328;\">Note:<\u002Fstrong> A \"significant cluster\" is defined as any color that survived both the intra-product merging step and a baseline coverage filter. The threshold for that filter varies based on color contrast—ranging from 1% for hues that starkly contrast with the dominant color, up to 5% for similar hues or neutral pairs.<\u002Fp>\n\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">The results showed that nearly 92% of the entire catalog consisted of solid, single-color products. Because a structural color combination investigation would apply to less than 10% of the data, the idea was set aside to focus strictly on treating each product as a representation of a singular, dominant color.<\u002Fp>\n\n    <h2 style=\"font-size:22px; font-weight:600; line-height:1.3; margin:44px 0 16px; padding:0 0 8px; border-bottom:1px solid #d8dee4; text-wrap:pretty;\">3. Visualization: Failed Approaches<\u002Fh2>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Of the ~1M total products, around ~340,000 products survive segmentation and heraldic filtering. Visualizing 340,000 products and their representative colors for direct human inspection and comparison introduced several technical hurdles.<\u002Fp>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Spatial Plotting<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Plotting every instance of color within products as an individual, color-coded and coverage scaled point (where point size is relative to the percentage of the garment area covered) is an intuitive starting point, but rigid geometric plots present several limitations:<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Issue - Visual Occlusion and Coordinate Stacking:<\u002Fstrong> In 3D LAB color space, foreground points hide background points; rotating the plot only changes which data points are obscured. A flat 2D (H/L) grid leads to coordinate stacking. Because thousands of products share similar color values, they plot directly on top of one another. The underlying data remains correct, but the visual volume is flattened. A small grouping of products and a thousand identical products can look exactly the same on the screen.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Issue - Perceptual Discretization:<\u002Fstrong> Spatial plotting presents color as a continuous, unsegmented cloud. Without distinct boundaries, it is impossible for a human to track where one color group ends and another begins, preventing any structured comparison between brands.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">K-means Clustered Bar Charts<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">A secondary k-means pass (k = ~6-20) over the intra-product clusters was explored to escape the spatial complications of earlier visualization attempts, aiming to produce a small set of color groups for easy comparison between brands.<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Issue - Generalization:<\u002Fstrong> K-means partitions data into a fixed number of clusters (K) by assigning each point to the nearest cluster mean, where each mean is the average of its assigned points. As a result, disparate colors can be pulled together into singular, massive clusters. A resulting bar chart might state that a catalog is \"40% black.\" That 40% is not a direct measurement of a specific color, but rather the total volume of a wide geometric boundary that might lump distinct charcoal, navy, and dark olive shades under a single averaged label.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Issue - Inadequate Resolution:<\u002Fstrong> Not only does k-means lead to generalizations of data in this context, it also eliminates the opportunity for a human to visually inspect the data en masse, which could lead to unexpected insights. “What if there is something interesting and subtle underlying the data, and it just isn’t visible?”.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Bin-based Discretization<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">To escape spatial plots, discretize, and consolidate the data, a bin-based approach was tested which divided LAB space into a number of equal cells, tracking how many data points fell into each.<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Issue - Boundary Fragmentation:<\u002Fstrong> Because the grid is imposed on the data rather than drawn from it, bin boundaries fall wherever they happen to fall – including straight through dense, cohesive groups of products. A single perceptual color group whose members straddle a cell edge could be split across two or more adjacent bins. The resulting centroid color for each bin isn’t an accurate reflection of the underlying data.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Issue - Bin-Size Dilemma:<\u002Fstrong> Adjusting the grid resolution trades one failure for another. Fine bins fragment cohesive groups more severely; coarse bins flatten distinct groups into merged categories. The bins large enough to contain statistically stable populations turned out to span roughly ΔE ≈ 25 – well past the point at which a single cell would contain internally cohesive products.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Force-Directed Graphs<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Seeding each datapoint using true (H/L) coordinates and running collision relaxation to push overlapping markers apart was another attempted approach.<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Issue - Perceptual Discretization, Interlaced Groups:<\u002Fstrong> While occlusion was eliminated, force simulation caused distinct color groups to bleed and interlace into one another. This blended boundary made it difficult to visually isolate a specific color category (like navy blue) and accurately judge its total volume.<\u002Fli>\n    <\u002Ful>\n\n    <h2 style=\"font-size:22px; font-weight:600; line-height:1.3; margin:44px 0 16px; padding:0 0 8px; border-bottom:1px solid #d8dee4; text-wrap:pretty;\">4. Visualization: Solutions: HAC and Adaptive Plotting<\u002Fh2>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">To resolve these tradeoffs, the final visualization relies on a two-part solution: an unsupervised, bottom-up clustering pipeline to consolidate and discretize the data, coupled with an adaptive, rule-based layout to render it.<\u002Fp>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Stage 1: Hierarchical Agglomerative Clustering (HAC)<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">Hierarchical Agglomerative Clustering (HAC) is an unsupervised learning algorithm used to group data into an organic, nested tree structure based on similarity. Unlike K-means, which requires a defined number of clusters (K) upfront and forces the data into a top-down partition, HAC works from the bottom up. Each product begins as its own individual, single-point cluster. The algorithm iteratively scans the dataset, finds the two closest clusters, and merges them into a new, larger cluster.<\u002Fp>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">To maintain strict internal cohesion, the pipeline uses complete linkage (farthest-neighbor clustering), meaning the distance between two clusters is defined by their most dissimilar points. Merging continues until the distance between clusters exceeds a defined threshold. The system performs two sequential HAC passes.<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 10px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Pass 1: Creating Internally Coherent, Externally Distinct “Zones”<\u002Fstrong><br>The first pass ingests the dominant color of all surviving products and groups them using a maximum-diameter threshold of ΔE = 8, This guarantees that the zones are “internally coherent”, meaning every product assigned to a zone sits within a virtually imperceptible color distance of every other product in that zone. They are also externally distinct, meaning that no two zones represent color groups that could be confused for one another.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Pass 2: Grouping “Hue Families”<\u002Fstrong><br>The second pass gathers these distinct zones into structural “hue families” – groups that represent shades or lightness variations of one another. By switching the proximity threshold to a strict horizontal radius (a*b* = 5), the algorithm gathers zones that fall in a narrow y-axis (Lightness) column. LAB space is not perfectly uniform, meaning these families aren’t always perfect shade variants (blue and purple, for example, tend to be problematic), but they provide the scaffolding needed for visual layout.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Stage 2: Adaptive Plot Construction<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">With the data structurally discretized into zones and hue families, visualization maps the total distribution onto a single view using five layout rules:<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Population-Scaled Zones:<\u002Fstrong> Zones are drawn as circles. To keep massive volumes legible, each zone’s diameter is the square root of its product count, normalized against the single largest zone belonging to the brand.<\u002Fli>\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Lightness-ordered Hue Family Rows:<\u002Fstrong> Each hue family occupies a horizontal row. Inside that row, member zones are plotted from left to right based on their Lightness value. Zones that would collide are nudged apart. Each plot is built by stacking hue family rows vertically.<\u002Fli>\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Saturation Thresholds:<\u002Fstrong> The data is sorted into three segments by default: neutral (HSB sat &lt; 5), muted (5 ≤ sat &lt; 50), and saturated (sat ≥ 50). Neutrals are ordered internally by Lightness, while the muted and saturated bands are sorted by hue angle. The visualization descends from neutrals to vivid.<\u002Fli>\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Size-Dependent Draw Order:<\u002Fstrong> Large zones are drawn under small zones.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Adaptive Vertical Scaling:<\u002Fstrong> A hue family’s row height is dictated by its largest member zone.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Results: (Mostly) Resolved Issues<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">The issues that broke earlier visualization attempts are, for the most part, mitigated.<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Zero Coordinate Stacking:<\u002Fstrong> Because the first HAC pass enforces a minimum separation threshold, no two zones can have identical LAB coordinates.<\u002Fli>\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Controlled Occlusion:<\u002Fstrong> While zones can still overlap within a hue family, the combination of sized-sorted draw order and adaptive row scaling ensures that small zones are never completely eclipsed by larger, more populous zones.<\u002Fli>\n      <li style=\"margin:0 0 8px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Perceptual Discretization Without Distortion:<\u002Fstrong> HAC consolidates and reveals the natural shape of the data rather than drawing arbitrary boundaries, or averaging products that don’t truly belong to the same color group. Products that have indistinguishable dominant colors are grouped, the rest are separated.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Maximized Consolidation without Generalization:<\u002Fstrong> K-means and bin-based approaches compromise resolution to achieve reduction. HAC with complete linkage, on the other hand, consolidates the data as much as possible without generalizing.<\u002Fli>\n    <\u002Ful>\n\n    <h2 style=\"font-size:22px; font-weight:600; line-height:1.3; margin:44px 0 16px; padding:0 0 8px; border-bottom:1px solid #d8dee4; text-wrap:pretty;\">5. Moving Forward: Maintenance &amp; Future Improvements<\u002Fh2>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:26px 0 10px; text-wrap:pretty;\">Data Attrition<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">As of the time of writing, of the 998,899 raw instances scraped and stored, the final visualization includes a high confidence subset of 343,719 products (34.4%). Of the products excluded, 25.0% do not represent system inadequacies – 21.3% deliberately filtered as “heraldic” products and 3.7% simply awaiting segmentation. That leaves 40.6% attributable to system leakage that may be mitigable.<\u002Fp>\n    <ul style=\"margin:0 0 16px; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 12px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Garment-Class Mismatch | 169,754 rows | 16.99%<\u002Fstrong><br>YOLO returns detections, but none carries a class label matching the target garment.\n        <ul style=\"margin:8px 0 0; padding:0 0 0 22px; list-style-type:circle;\">\n          <li style=\"margin:0 0 6px; text-wrap:pretty;\">Target garment not detected - YOLO identified other objects, but not the target garment.<\u002Fli>\n          <li style=\"margin:0; text-wrap:pretty;\">The target garment was identified, but assigned a class outside the product title’s synonym set, either because YOLO assigned the wrong class or because the keyword map isn’t comprehensive enough.<\u002Fli>\n        <\u002Ful>\n      <\u002Fli>\n      <li style=\"margin:0 0 12px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">No Detection | 108,390 rows | 10.85%<\u002Fstrong><br>Among products whose titles did route to a target class, YOLO returns zero masks. The model finds nothing it recognizes as a garment under the Fashionpedia annotation schema.<\u002Fli>\n      <li style=\"margin:0 0 12px; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Unrecognized Title | 108,105 rows | 10.82%<\u002Fstrong><br>The product title contains no word in the brand’s keyword map. Concentrated on Lululemon, who often names products using proprietary brand keywords (“Align”, “Groove”).<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\"><strong style=\"font-weight:600;\">Post-Segmentation Edge Cases | 19,081 | 1.91%<\u002Fstrong><br>Clustering failure – the product was segmented but did not produce clusters in the initial k-means pass. This could be the result of a corrupt or empty image file, fully transparent mask, or too few opaque pixels.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-size:17px; font-weight:600; line-height:1.4; margin:30px 0 10px; text-wrap:pretty;\">Ongoing Maintenance Surfaces<\u002Fh3>\n    <p style=\"font-size:16px; line-height:1.6; margin:0 0 16px; text-wrap:pretty;\">This section is a placeholder for planned expansion. Two of the pipeline's most critical decision points depend on assumptions that were validated against a snapshot of the data, and both are living surfaces:<\u002Fp>\n    <ul style=\"margin:0; padding:0 0 0 24px; font-size:16px; line-height:1.6;\">\n      <li style=\"margin:0 0 10px; text-wrap:pretty;\">The keyword map that routes product titles into their target segmentation classes. Coverage needs to be re-measured as brands introduce new product lines and proprietary product names — particularly Lululemon, where naming conventions drift most quickly.<\u002Fli>\n      <li style=\"margin:0 0 10px; text-wrap:pretty;\">The chroma-gated cluster merge rule. Pair-level accuracy was measured against a 300-product Nike snapshot; as new product categories enter the catalog (e.g., an expansion into cross-category apparel, or new colorway conventions), the merge rule's accuracy on that new content is unmeasured.<\u002Fli>\n      <li style=\"margin:0 0 10px; text-wrap:pretty;\">The heraldic filter's team, city, and league lexicon. Same drift pattern as the keyword map — validated at 95.6% recall / 81.8% precision against an 800-product hand-labeled sample, then left static. NFL rosters change every season, MLS expands, new leagues emerge; the filter will silently under-catch as those shift.<\u002Fli>\n      <li style=\"margin:0 0 10px; text-wrap:pretty;\">The random-forest model that propagates zone labels from Nike Men's manual labels to the other nine brand-gender segments. The RF learns the labeler's decisions within the LAB region the training clusters cover, and generalizes reliably within that region. Outside it — when a brand introduces colorways at LAB positions the training set didn't touch (a new fluorescent line, an earth-tone capsule) — the RF's label is an extrapolation to the nearest known region, not a validated assignment. No accuracy measurement exists for RF predictions on that kind of drift-into-new-territory data.<\u002Fli>\n      <li style=\"margin:0; text-wrap:pretty;\">The fine-tuned YOLO segmentation model. Trained against Fashionpedia's annotation schema, which itself was frozen well before the current catalog. If brands introduce genuinely novel garment silhouettes — technical vests with unconventional geometries, hybrid-category apparel that doesn't map cleanly to a Fashionpedia class — the model's recall on those categories degrades silently. This is a fine-tune-cycle question, not a re-measure-and-patch question, so its cadence differs from the surfaces above.<\u002Fli>\n    <\u002Ful>\n\n  <\u002Farticle>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
