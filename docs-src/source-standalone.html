document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 padding:24px; }\n    .readme { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:32px 40px 48px; }\n    .gh { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:16px; line-height:1.5; color:#1f2328; }\n    .gh h1 { font-size:2em; font-weight:600; padding-bottom:.3em; border-bottom:1px solid #d8dee4; margin:0 0 16px; }\n    .gh h2 { font-size:1.5em; font-weight:600; padding-bottom:.3em; border-bottom:1px solid #d8dee4; margin:36px 0 16px; }\n    .gh h3 { font-size:1.05em; font-weight:600; margin:22px 0 6px; }\n    .gh p { margin:0 0 16px; }\n    .gh code { font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:85%; background:#818b981f; padding:.2em .4em; border-radius:6px; }\n    .gh ul { margin:0 0 16px; padding-left:2em; }\n    .gh li { margin:.15em 0; }\n    .gh .muted { color:#59636e; }\n    .gh .shared-tag { display:inline-block; font-size:13px; font-family:'IBM Plex Mono',monospace; color:#fff; border:1px solid #57606a; background:#57606a; border-radius:10px; padding:1px 8px; margin-left:8px; vertical-align:middle; }\n    .seq { border:1px solid #d0d7de; border-radius:6px; padding:16px; background:#fff; margin:0 0 16px; overflow-x:auto; }\n    .seq svg { max-width:100%; height:auto; display:block; margin:0 auto; }\n    .gh h3.cmdhdr { position:relative; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; color:#1f2328; margin:28px 0 14px; padding:10px 22px; border:1.5px solid var(--cc,#57606a); border-radius:3px; background:#fff; }\n    .gh h3.cmdhdr::before, .gh h3.cmdhdr::after { content:''; position:absolute; top:0; bottom:0; width:1.5px; background:var(--cc,#57606a); }\n    .gh h3.cmdhdr::before { left:6px; }\n    .gh h3.cmdhdr::after { right:6px; }\n    .gh h3.cmdhdr .pmt { color:#a8a29e; }\n    .shot { width:100%; min-height:240px; border:2px dashed #d0d7de; border-radius:6px; background:#f6f8fa; display:flex; align-items:center; justify-content:center; text-align:center; color:#59636e; font-size:14px; margin:0 0 18px; font-family:'IBM Plex Mono',monospace; }\n    .filebar { font-family:'IBM Plex Mono',monospace; font-size:12px; color:#59636e; background:#f6f8fa; border:1px solid #d0d7de; border-bottom:none; border-radius:6px 6px 0 0; padding:6px 12px; }\n    .filebar + .readme { border-radius:0 0 6px 6px; }\n    .gh .badge-found { font-size:11px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.05em; color:#0969da; background:#ddf4ff; border:1px solid #b6e3ff; border-radius:10px; padding:2px 9px; vertical-align:middle; font-weight:500; }\n    .gh .callout { border-left:4px solid #1a7f37; background:#dafbe166; padding:10px 14px; border-radius:0 6px 6px 0; color:#1f2328; margin:0 0 16px; }\n    .seq-found { border:2px solid #54aeff !important; background:#f6fbff !important; }\n    .gh .downstream-note { color:#59636e; font-size:14px; margin:28px 0 4px; padding-top:16px; border-top:1px dashed #d0d7de; }\n    .gh h4 { font-size:.98em; font-weight:600; margin:20px 0 6px; }\n    .gh h4.tunhdr { margin:30px 0 8px; font-weight:400; }\n    .gh .tunblock { padding-left:22px; border-left:2px solid #e0f2f4; margin-left:2px; }\n    .gh h4.tunhdr .tunpill { display:inline-block; font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:13px; font-weight:600; color:#0e7490; background:#cffafe; border:1.5px solid #0e7490; border-radius:999px; padding:5px 16px; }\n    .gh h1.tier { margin-top:52px; }\n    .gh h1.tier-found { margin-top:52px; color:#1a7f37; }\n    .gh h3 { border-bottom:none; }\n    .seq-ov { background:#f9fbff !important; border:1px solid #d0d7de !important; }\n    .gh .cmddetail { border:1px solid #d0d7de; border-radius:6px; margin:0 0 16px; overflow:hidden; }\n    .gh .cdrow { display:grid; grid-template-columns:130px 1fr; gap:14px; padding:11px 15px; border-top:1px solid #eaeef2; }\n    .gh .cdrow:first-child { border-top:none; }\n    .gh .cdlabel { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#59636e; padding-top:3px; }\n    .gh .cdval { font-size:14px; line-height:1.5; }\n    .gh code.cdcmd { display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:13px; background:#1f2328; color:#e6edf3; padding:6px 12px; border-radius:6px; }\n    .gh pre.term { font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.6; background:#1f2328; color:#e6edf3; padding:14px 16px; border-radius:6px; margin:0 0 16px; overflow-x:auto; white-space:pre; }\n    .gh pre.term code { background:none; padding:0; font-size:inherit; color:inherit; }\n    .gh pre.term .c { color:#8b949e; }\n    .gh pre.term .f { color:#7ee787; }\n    .gh code.cdcmd .arg { color:#ff7b72; }\n    .gh .dbbadge { display:inline-block; white-space:nowrap; font-size:13px; font-weight:600; color:#3a4b8c; background:#eef1fb; border:1px solid #c7d0f0; border-radius:5px; padding:1px 9px; }\n    .gh .cdsub { color:#59636e; font-size:13px; margin-top:5px; }\n    .gh .idem { display:inline-block; font-size:13px; font-weight:600; border-radius:5px; padding:1px 9px; }\n    .gh .idem.no { color:#9a3412; background:#fff1e5; border:1px solid #f0c39a; }\n    .gh .idem.yes { color:#1a7f37; background:#dafbe1; border:1px solid #aecfb6; }\n    .gh .delbadge { display:inline-block; font-size:13px; font-weight:600; color:#57606a; background:#f6f8fa; border:1px solid #d0d7de; border-radius:5px; padding:1px 8px; }\n    .gh .delpill { display:inline-block; white-space:nowrap; font-size:13px; font-weight:600; color:#24292f; background:#fff; border:1.5px solid #57606a; border-radius:999px; padding:2px 11px; }\n    .gh .pathchip { display:inline-block; white-space:nowrap; font-size:13px; font-weight:600; color:#57606a; background:#f6f8fa; border:1px solid #d0d7de; border-radius:5px; padding:1px 9px; }\n    .gh .iov { font-style:italic; color:#59636e; }\n    .gh .cmddetail .tunpill { display:inline-block; font-family:'IBM Plex Sans',system-ui,sans-serif; font-weight:600; font-size:13px; color:#0e7490; background:#cffafe; border:1px solid #0e7490; border-radius:999px; padding:2px 13px; }\n    .gh .ccdpill { display:inline-block; font-family:'IBM Plex Sans',system-ui,sans-serif; font-weight:600; font-size:13px; color:#1e3a8a; background:#dbeafe; border:1px solid #2563eb; border-radius:999px; padding:2px 12px; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"page\">\n  <div class=\"readme gh\" ref=\"{{ root }}\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  root = React.createRef();\n\n  get stages(){\n    return [\n      { n:\"1\", title:\"data_prep\", foundation:true,\n        seq:\"flowchart LR\\n  img([product images]) --> seg[[\\\"cli.py segment\\\"]] --> clu[[\\\"cli.py extract-colors\\\"]] --> ccd([clustered color data])\\n  classDef out fill:#dbeafe,stroke:#2563eb,stroke-width:2px;\\n  class ccd out;\",\n        tunables:[\n          { id:\"HERALDIC_KEYWORDS\", tunes:\"segment\",\n            src:\"a Python list concatenating category sub-lists (product-type exclusions, generic terms, states, cities, colleges, countries, sports terms, and pro rosters — soccer/football/basketball/baseball/hockey) — <code>data_prep/heraldic_filter.py<\u002Fcode>\",\n            role:\"pre-inference filter — a title hitting a team roster (NFL/NBA/MLB/NHL/soccer), a US city, a college/NCAA, or an Olympic-country term is dropped before YOLO ever runs. These carry prescribed team colors, not the brand's own design choices. Matched case-insensitively as <code>\\\\b(word)\\\\b<\u002Fcode> against both <code>title<\u002Fcode> and <code>title_second<\u002Fcode>.\",\n            cmd:\"<code>discover-heraldic-keywords<\u002Fcode> · <code>validate-heraldic-filter<\u002Fcode>\",\n            output:\"📄 <code>candidates.csv<\u002Fcode> (brand-skew-ranked additions) · 🖥 <code>labeler.html<\u002Fcode> (blind hand-labeling, prediction hidden to avoid anchoring) · 📄 <code>analysis.txt<\u002Fcode> (precision / recall / F1 + Wilson CIs). Last measured: 95.6% recall, 81.8% precision on 800 labels.\",\n            user:\"\" },\n          { id:\"BRAND_KEYWORD_MAPS\", tunes:\"segment\",\n            src:\"a per-brand dict (title word → Fashionpedia class synonyms) — <code>data_prep/keyword_maps.py<\u002Fcode>\",\n            role:\"picks which detected garment is the target. A title word (“hoodie”, “polo”) maps to a Fashionpedia class, and the largest YOLO mask of that class becomes the hero garment; a title with no mapped word drops the product. Recognition coverage ~80–98% by brand (98% Nike).\",\n            cmd:\"<code>validate-keyword-map<\u002Fcode>\",\n            output:\"📄 per-brand coverage % over denominator + a list of uncovered titles (mirrors the SQL regex-inversion behind the original 98% Nike figure)\",\n            user:\"\" },\n          { id:\"IOU_THRESHOLD = 0.15 / OVERLAP_RATIO_THRESHOLD = 0.1\", tunes:\"segment\", manual:true,\n            src:\"float constants — <code>data_prep/segment.py<\u002Fcode>\",\n            role:\"attribute-merge gate. Once the hero garment is chosen, each detected attribute (sleeve, collar, cuff, hood, pocket, zipper, …) or secondary garment is folded into the hero mask if its IoU with the hero box &gt; 0.15 OR its overlap with the dilated hero mask &gt; 0.1 — capturing contrasting sleeves/collars that are part of the garment's palette. Lower = more aggressive merging.\",\n            cmd:\"no command — hand-judged. Read the per-product merge line (candidates evaluated / merged / Avg IoU / Avg Overlap) in <code>processing_log.txt<\u002Fcode>, compare the merged masks against the source images, adjust the constants, and re-run.\",\n            output:\"📄 <code>processing_log.txt<\u002Fcode> (per-product merge counts + IoU/overlap averages), inside each segmentation output folder\",\n            user:\"\" },\n          { id:\"NUM_CLUSTERS = 5\", tunes:\"extract-colors\", manual:true,\n            src:\"int constant — <code>data_prep/cluster.py<\u002Fcode>\",\n            role:\"dominant colors extracted per garment. K-means (k=5) runs on the garment's masked pixels in LAB space; the 5 centroids and their coverage % become that product's palette and feed every downstream deliverable. Clustering is done in LAB (not RGB) so Euclidean distance tracks perceptual difference.\",\n            cmd:\"no tuning command — 5 is a fixed design choice. There is no automated grader, and changing it would ripple through every downstream stage, so it's held constant.\",\n            user:\"\" }\n        ]},\n      { n:\"2\", title:\"palette_explorer\",\n        seq:\"flowchart LR\\n  ccd([\\\"<span style='white-space:nowrap;color:#1e3a8a'>▤ cluster_fpyolo11l241114_kmeans250218<\u002Fspan>\\\"]) --> a[[\\\"cli.py consolidate-colors\\\"]] --> b[[\\\"cli.py assign-zones\\\"]] --> c[[\\\"cli.py palette-explorer\\\"]] --> d\\n  d@{ shape: card, label: \\\"<b>palette_explorer.html<\u002Fb>\\\" }\\n  style d fill:#fff,stroke:#8250df,stroke-width:1px,color:#6639ba;\\n  classDef cmd fill:#fff,stroke:#8250df;\\n  class a,b,c cmd;\\n  classDef up fill:#dbeafe,stroke:#2563eb,stroke-width:2px;\\n  class ccd up;\",\n        tunables:[\n          { id:\"hue-merge rule\", tunes:\"consolidate-colors\", ref:true },\n          { id:\"CLUSTER_THRESHOLD = 8\", tunes:\"consolidate-colors\",\n            src:\"int constant (CIEDE2000 ΔE diameter) — <code>palette_explorer/build_color_clusters.py<\u002Fcode>\",\n            role:\"HAC Pass 1 diameter: products within ΔE = 8 (CIEDE2000) form one cluster. Intentionally tight (over-discriminative) to keep clusters pure where dissimilar colors sit close; the resulting over-segmentation is corrected downstream by zone merging.\",\n            cmd:\"Iterative human-review loop. Run <code>consolidate-colors &lt;brand&gt; --gender &lt;g&gt;<\u002Fcode> to build clusters at the current value, then <code>review-cluster-quality &lt;brand&gt; --gender &lt;g&gt;<\u002Fcode> to render that same segment for inspection. Adjust the constant and re-run both until clusters hold together by eye.\",\n            output:\"A self-contained HTML page at <code>outputs/diagnostic_cluster_review/&lt;brand&gt;_&lt;gender&gt;/cluster_review.html<\u002Fcode> — one tab per cluster, each showing that cluster's 20 most color-diverse products (farthest-point CIEDE2000 sample, chosen to surface misfits).\",\n            user:\"\" },\n          { id:\"cluster_zones.json\", tunes:\"assign-zones\",\n            src:\"the hand-built reference file <code>outputs/nike_mens/cluster_zones.json<\u002Fcode> — cluster→zone assignments created via <code>build-zones<\u002Fcode>. (The ~9 files <code>assign-zones<\u002Fcode> writes for other segments are its outputs, not this tunable.)\",\n            role:\"HAC Pass-1 clusters are deliberately over-discriminative; zones merge the near-identical ones into human-meaningful groups. assign-zones trains a Random Forest on the reference labels and propagates that merging to the remaining ~9 brand/genders.\",\n            cmd:\"hand-label nike/mens once — <code>build-zones nike --gender mens<\u002Fcode> → label in the tool → export — then <code>assign-zones &lt;b&gt; &lt;g&gt;<\u002Fcode> propagates it to the other ~9 segments. (To use a different segment as ground truth, change TRAINING_BRAND / TRAINING_GENDER in <code>palette_explorer/assign_zones.py<\u002Fcode>.)\",\n            output:\"<code>cluster_zone_builder.html<\u002Fcode> (the labeling tool)\",\n            user:\"\" },\n          { id:\"CONFIDENT_MERGE_PROB = 0.80\", tunes:\"assign-zones\",\n            src:\"float constant CONFIDENT_MERGE_PROB = 0.80 — <code>palette_explorer/assign_zones.py<\u002Fcode>. (scipy's linkage merges on distance, so the code derives 1 − 0.80 = 0.20 inline at the merge step — there's no separate distance constant.)\",\n            role:\"the RF scores each pair of target clusters with a “same-zone?” probability; agglomerative complete-linkage merges only pairs it's ≥ 80% confident about. Higher = stricter (more, smaller zones); lower = looser (fewer, broader zones).\",\n            cmd:\"run <code>assign-zones nike --gender mens<\u002Fcode> (self-validation). Read the printed ARI/NMI agreement scores; if they're too low, use the Manual-zones vs Auto-zones counts to see whether the RF is over-merging (fewer auto zones) or under-merging (more), adjust CONFIDENT_MERGE_PROB, and re-run until the scores plateau — before propagating to the other segments\",\n            output:\"<code>auto_cluster_zones.json<\u002Fcode> (the RF's version, saved for optional cluster-level inspection — the tuning decision is read from the console ARI/NMI)\",\n            user:\"\" },\n          { id:\"hue-family row radius = 5\", tunes:\"palette-explorer\",\n            src:\"a default argument <code>radius=5<\u002Fcode> on <code>load_brand_data()<\u002Fcode> (<code>palette_explorer/palette_explorer.py:239<\u002Fcode>), passed explicitly at its only call site (<code>palette_explorer.py:2983<\u002Fcode>) — so editing the signature default alone changes nothing; edit the call. The grouping logic is <code>find_ab_groups()<\u002Fcode> in <code>palette_explorer/hue_family_grouping.py<\u002Fcode>, the single definition shared with <code>tune_hue_family_rows.py<\u002Fcode> so the explorer and its tuner can't drift.\",\n            role:\"HAC Pass 2 — complete-linkage grouping of zone centroids in the a*b* plane. Every pair inside a family must be within 5 a*b* units of every other (no chaining). Purely presentational: it sets the row scaffolding of the layout and never touches cluster or zone data.\",\n            cmd:\"run <code>tune-hue-family-rows &lt;b&gt; --gender &lt;g&gt;<\u002Fcode>, which sweeps <code>RADII_SWEEP = [5, 7, 10, 14]<\u002Fcode> (<code>tune_hue_family_rows.py:37<\u002Fcode>) and renders one full column preview per radius for that segment. Compare by eye, then write the chosen value into the <code>radius=<\u002Fcode> argument at the call site and re-run <code>palette-explorer<\u002Fcode>.\",\n            output:\"<code>outputs/&lt;b&gt;_&lt;g&gt;/hue_family_tuning/ab_neighbor_diagnostic.html<\u002Fcode> — all four radii in one page, each row an L*-sorted swatch strip labeled with its zone count and L* span, plus the singletons — and <code>ab_column_preview_R5.html<\u002Fcode>, <code>_R7<\u002Fcode>, <code>_R10<\u002Fcode>, <code>_R14<\u002Fcode> in the same folder, each a full column preview with a click-through thumbnail panel (thumbnails come from the segment's <code>thumbs/<\u002Fcode>, so they appear only once <code>assign-zones<\u002Fcode> or <code>build-zones<\u002Fcode> has generated them).\",\n            user:\"\" }\n        ]},\n      { n:\"3\", title:\"archetype_taxonomy\",\n        seq:\"flowchart LR\\n  ccd([\\\"<span style='white-space:nowrap;color:#1e3a8a'>▤ cluster_fpyolo11l241114_kmeans250218<\u002Fspan>\\\"]) --> a[[\\\"cli.py archetypes\\\"]] --> b[[\\\"cli.py archetype-distribution\\\"]] --> c\\n  c@{ shape: card, label: \\\"<b>archetype_distribution.html<\u002Fb>\\\" }\\n  style c fill:#fff,stroke:#bc4c00,stroke-width:1px,color:#953800;\\n  classDef cmd fill:#fff,stroke:#bc4c00;\\n  class a,b cmd;\\n  classDef up fill:#dbeafe,stroke:#2563eb,stroke-width:2px;\\n  class ccd up;\",\n        tunables:[\n          { id:\"archetype thresholds\", tunes:\"archetypes\",\n            src:\"five module-level constants in <code>archetype_taxonomy/classify_archetypes.py<\u002Fcode> — <code>DOMINANCE_RATIO=2.0<\u002Fcode> (<code>:82<\u002Fcode>), <code>SECONDARY_COVERAGE_THRESHOLD=10<\u002Fcode> (<code>:87<\u002Fcode>), and the hue-aware significance triple <code>SIGNIFICANCE_THRESHOLD_OPPOSITE_HUE=1<\u002Fcode> (<code>:77<\u002Fcode>), <code>SIGNIFICANCE_THRESHOLD_DIFFERENT_HUE=3<\u002Fcode> (<code>:78<\u002Fcode>), <code>SIGNIFICANCE_THRESHOLD_SIMILAR_HUE=5<\u002Fcode> (<code>:79<\u002Fcode>). They're read directly by <code>filter_significant_clusters()<\u002Fcode> (<code>:204<\u002Fcode>) and <code>classify_structure()<\u002Fcode> (<code>:258<\u002Fcode>); no CLI override, edit the constants.\",\n            role:\"Post-merge, the classifier walks a two-step decision tree on each product's merged palette. First <code>filter_significant_clusters()<\u002Fcode> keeps only colors whose coverage beats a hue-dependent significance floor — a color whose hue is &gt;90° from the dominant needs ≥1% coverage to count, &gt;45° needs ≥3%, similar hue needs ≥5% (<code>:242-250<\u002Fcode>). Then <code>classify_structure()<\u002Fcode> labels the surviving palette: 1 color → MONO; 2 colors with ratio ≥ DOMINANCE_RATIO → DOM_ACC else DUAL_BAL; 3+ colors with combined secondary coverage &lt; SECONDARY_COVERAGE_THRESHOLD → DOM_ACC (tiny accents), else MULTI_DOM if dominant ≥ 50% else MULTI_BAL (<code>:293-300<\u002Fcode>).\",\n            cmd:\"run <code>archetype-review<\u002Fcode> to draw (or reuse) a stratified validation sample and render the browser labeling tool; hand-label archetype and merge, export from the tool as <code>validation_results_hsb.csv<\u002Fcode>, then run <code>validate-archetypes<\u002Fcode> to score. Reuse is the default — the sample is redrawn only with <code>--resample<\u002Fcode>, so the labels you already have aren't orphaned by an accidental rebuild (<code>review_archetype_labels.py:16-20<\u002Fcode>). Adjust the constants, re-run <code>archetypes<\u002Fcode>, re-open the tool (regenerated cheaply every review), re-validate.\",\n            output:\"<code>archetype_taxonomy/outputs/archetype_validation.html<\u002Fcode> (the labeling tool — one row per sampled product, buttons for the archetype guesses, a merge-labeling panel) and <code>archetype_taxonomy/outputs/archetype_accuracy.txt<\u002Fcode> (the <code>validate-archetypes<\u002Fcode> report — overall accuracy with a Wilson 95% CI, 5-class confusion matrix, per-class precision/recall/F1, and the top misclassification flows, <code>validate_arch stroke:#0e7490,stroke-width:2px,stroke-dasharray:3 8;\",\n      coverage: \"flowchart TB\\n  ccd([\\\"<span style='white-space:nowrap;color:#1e3a8a'>▤ cluster_fpyolo11l241114_kmeans250218<\u002Fspan>\\\"])\\n  co2[[\\\"cli.py visualize-coverage\\\"]]\\n  cod([\\\"<b style='white-space:nowrap'>❐ coverage_distribution.html<\u002Fb>\\\"])\\n  ccd --> co2\\n  co2 --> cod\\n  classDef cmd fill:#fff,stroke:#9a6700;\\n  class co2 cmd;\\n  style ccd fill:#dbeafe,stroke:#2563eb,stroke-width:2px,color:#1e3a8a;\\n  style cod fill:#fff,stroke:#9a6700,stroke-width:1px,color:#7d4e00;\"\n    };\n    const blurb = {\n      palette_explorer: \"<b style='color:#6639ba'>palette_explorer.html<\u002Fb> — the headline deliverable: a single at-a-glance view of a brand's entire color distribution. Two HAC passes consolidate every product's dominant color into internally-coherent zones (ΔE = 8), group those into hue families, and an adaptive layout renders them as population-scaled circles in lightness-ordered rows.\",\n      archetype_taxonomy: \"<b style='color:#953800'>archetype_distribution.html<\u002Fb> — classifies each product by color structure into one of five archetypes (MONO, DOM_ACC, DUAL_BAL, MULTI_DOM, MULTI_BAL) from how many significant color clusters survive merging and how dominant they are, then reports the mix across the brand (≈92% of the catalog is single-color).\",\n      drift: \"<b style='color:#99286e'>drift_comparison.html<\u002Fb> — tracks how a brand's color distribution shifts across the 16-month window; the mechanism for detecting seasonal and collection-level change over time.\",\n      coverage: \"<b style='color:#7d4e00'>coverage_distribution.html<\u002Fb> — reports how much of each brand × gender segment actually reached the visualization: the recognition and segmentation coverage behind the ~34% of raw instances that survive, and where the rest leak out.\"\n    };\n    const renderStage = (s,isF)=>{\n      let h = isF ? \"\" : \"<h1 class='tier' style='color:\"+(brandColor[s.title]||'#1f2328')+\"'>\"+s.title+\"<\u002Fh1>\";\n      if(isF) h += \"<p class='callout'>Runs once per brand, turning raw product images into <code>clustered color data<\u002Fcode>. Provides the data that feeds the four key deliverables.<\u002Fp>\";\n      else if(blurb[s.title]) h += \"<p class='callout' style='border-left-color:\"+calBorder[s.title]+\";background:\"+calBg[s.title]+\"99'>\"+blurb[s.title]+\"<\u002Fp>\";\n      if(!isF && deliv[s.title]) h += \"<div class='shot'>▦ &nbsp;screenshot — \"+deliv[s.title]+\"<\u002Fdiv>\";\n      h += \"<div class='seq' data-seq='dia-\"+s.title+\"'>…<\u002Fdiv>\";\n      (commands[s.title]||[]).forEach(cn=>{\n        h += \"<h3 class='cmdhdr' style='--cc:\"+(isF?'#1a7f37':(calBorder[s.title]||'#57606a'))+\"'><span class='pmt'>❯ <\u002Fspan>cli.py \"+cn+((cmdDetail[cn]&&!cmdDetail[cn].hideArgSig&&Array.isArray(cmdDetail[cn].args)&&cmdDetail[cn].args.length)?\" <span style='color:#ff7b72'>\"+cmdDetail[cn].args.map(a=>a[0]).join(\" \")+\"<\u002Fspan>\":\"\")+\"<\u002Fh3>\";\n        const grp = s.tunables.filter(t=>t.tunes===cn);\n        if(cmdDetail[cn]) h += this.cmdDetailHtml(cmdDetail[cn], grp, {b:(calBorder[s.title]||'#57606a'), t:(brandColor[s.title]||'#24292f'), bg:(calBg[s.title]?calBg[s.title]+'99':'#fff')});\n        else if(grp.length) grp.forEach(t=> h += this.tunableHtml(t));\n        else h += \"<p class='muted' style='margin:0 0 12px'>No tunables.<\u002Fp>\";\n      });\n      return h;\n    };\n    let html = \"<h1>Data Flow &amp; Usage — Operator's Reference<\u002Fh1>\";\n    const sansF=\"'IBM Plex Sans',system-ui,sans-serif\";\n    const sCmd=\"font-family:\"+sansF+\";font-size:.85em;color:#24292f;background:#fff;border:1px solid #57606a;border-radius:2px;padding:2px 9px;box-shadow:inset 3px 0 0 -2px #57606a,inset -3px 0 0 -2px #57606a;white-space:nowrap;\";\n    const sTun=\"font-family:\"+sansF+\";font-size:.84em;font-weight:500;color:#0e7490;background:#cffafe;border:1px solid #0e7490;border-radius:999px;padding:2px 10px;white-space:nowrap;\";\n    const sDel=\"display:inline-block;font-family:\"+sansF+\";font-size:.84em;font-weight:600;color:#24292f;background:#fff linear-gradient(225deg,#57606a 0 6px,transparent 6px) top right/9px 9px no-repeat;border:1.5px solid #57606a;border-radius:2px;padding:2px 11px;white-space:nowrap;\";\n    const sStage=\"font-family:\"+sansF+\";font-size:.85em;font-weight:700;color:#1a7f37;background:#dafbe1;border:1px solid #1a7f37;border-radius:4px;padding:2px 10px;white-space:nowrap;\";\n    const sCcd=\"font-family:\"+sansF+\";font-size:.85em;color:#1e3a8a;background:#dbeafe;border:1px solid #2563eb;border-radius:999px;padding:2px 10px;white-space:nowrap;\";\n    const delChip=(bg,bd,tx,name)=>\"<span style=\\\"display:inline-block;font-family:\"+sansF+\";font-weight:700;font-size:.9em;color:\"+tx+\";background:\"+bg+\" linear-gradient(225deg,\"+bd+\" 0 8px,transparent 8px) top right/11px 11px no-repeat;border:2px solid \"+bd+\";border-radius:2px;padding:4px 13px;white-space:nowrap\\\">\"+name+\"<\u002Fspan>\";\n    html += \"<p>The pipeline produces four deliverables — standalone HTML data visualizations and exploratory tools, one per downstream stage:<\u002Fp>\";\n    html += \"<ul><li><b style='color:#6639ba'>palette_explorer.html<\u002Fb><\u002Fli><li><b style='color:#953800'>archetype_distribution.html<\u002Fb><\u002Fli><li><b style='color:#99286e'>drift_comparison.html<\u002Fb><\u002Fli><li><b style='color:#7d4e00'>coverage_distribution.html<\u002Fb><\u002Fli><\u002Ful>\";\n    html += \"<p>None of them can be built until the <b style='color:#1a7f37'>data_prep<\u002Fb> stage has extracted clustered color data from source images.<\u002Fp>\";\n    html += \"<p>Deliverables can be built using a sequence of <b style='color:#57606a'>CLI commands<\u002Fb>.<br><br><b style='color:#0e7490'>Tunables<\u002Fb> are modifiable constants, keyword dictionaries, threshold files, etc… that influence output deliverables.<br><br><\u002Fp>\";\n    html += \"<p style='margin:22px 0 4px;font-weight:600;color:#57606a;font-size:.9em'>Legend<\u002Fp>\";\n    html += \"<div class='seq' data-seq='legend'>…<\u002Fdiv>\";\n    html += \"<p class='muted' style='font-size:.85em;margin:-6px 0 16px'>Solid arrows show data flow — each command reads the output file produced by the previous one. Dotted teal lines link a <b style='color:#0e7490'>tunable<\u002Fb> to the command it configures.<\u002Fp>\";\n    html += \"<h1 class='tier-found'>data_prep<\u002Fh1>\";\n    html += renderStage(found,true);\n    down.forEach(s=> html += renderStage(s,false));\n    html += \"<h1 class='tier' style='color:#0e7490'><sup style='color:#d1242f'>†<\u002Fsup> shared tunables<\u002Fh1>\";\n    html += \"<p class='callout' style='border-left-color:#0e7490;background:#cffafe55'>Some tunables configure more than one stage. They're documented once here; the stages that use them link back to this section.<\u002Fp>\";\n    const hueMerge = { id:\"hue-merge rule\",\n      src:\"int constants in <code>shared/palette_merge/palette_merge.py<\u002Fcode> — HUE_MERGE_THRESHOLD = 25° (max hue gap to merge two chromatic colors), LOW_CHROMA_MERGE_THRESHOLD = 15 (chroma below which a color counts as low-chroma/near-neutral), LOW_CHROMA_MAX_DELTA_L = 35 (the lightness guard), plus NEUTRAL_CHROMA_THRESHOLD = 8 (chroma below which a color has no usable hue). Shared — the same merge primitive also builds the palettes the archetype classifier consumes, so changing it moves two deliverables.\",\n      role:\"per-product merge that runs before HAC Pass 1. For each product it collapses colors that are just lighting artifacts (highlights/shadows) into one and keeps the dominant survivor as that product's color for clustering. Two low-chroma/neutral colors merge only if their lightness is within LOW_CHROMA_MAX_DELTA_L (35) — this keeps black+white from collapsing together; two chromatic colors merge if their hue is within HUE_MERGE_THRESHOLD (25°), with no lightness guard — which is why navy over-merging into royal blue is a known, unfixed limitation, not something these thresholds prevent.\",\n      cmd:\"data-driven, then by hand.<br><b>①<\u002Fb> Build the labeling tool: run <code>archetype-review --strata pair-features<\u002Fcode> — one command that classifies (if needed), draws a boundary-oversampled sample (deliberately loaded with color pairs sitting near the hue/chroma/ΔL thresholds, which fits merge-rule tuning far better than the default archetype-stratified sample), and renders <code>archetype_validation_pairfeatures.html<\u002Fcode> (separately named so it can't clobber an archetype-accuracy sample). The default <code>--strata archetype<\u002Fcode> also captures merge labels in passing, but under-samples the ambiguous pairs this decision hinges on.<br><b>②<\u002Fb> Label: open that page and click each color swatch to cycle it into the right group (which of a product's colors are really the same); export <code>merge_labels_all_brands.csv<\u002Fcode>.<br><b>③<\u002Fb> Fit + apply: run <code>tune-merge-rules --input merge_labels_all_brands.csv --propose-constants<\u002Fcode> — it scores the live merge rule against your labels and proposes new values in the shape of the constants (e.g. HUE_MERGE_THRESHOLD 25 → 27, acc 94.7% → 95.1%) with a cross-validation guard. Edit the constants by hand in <code>palette_merge.py<\u002Fcode>; the tool never writes them.\",\n      output:\"<code>outputs/merge_rule_discovery/<\u002Fcode> — the proposals (<code>merge_constant_proposals.txt<\u002Fcode>, <code>merge_constant_sweep.csv<\u002Fcode>), decision-boundary HTML plots (labeled pairs against hue-difference and ΔL), and <code>pairwise_features.csv<\u002Fcode>. Adding <code>--fit-tree<\u002Fcode> instead also writes a decision tree (<code>merge_rules_discovered.txt<\u002Fcode>).\",\n      user:\"\" };\n    html += this.cmdDetailHtml({}, [hueMerge], {b:'#0e7490', t:'#0e7490', bg:'#cffafe55'});\n\n    html += \"<h1 class='tier' style='color:#57606a'>Docker usage<\u002Fh1>\";\n    html += \"<p class='callout' style='border-left-color:#57606a;background:#f6f8fa'>Docker is the intended path — the container ships with the CUDA stack, the Python dependencies, and the right paths for images and outputs. Every <code>cli.py &lt;command&gt; &lt;args&gt;<\u002Fcode> invocation in this document translates to the same wrapper.<\u002Fp>\";\n\n    html += \"<h3>One-time setup<\u002Fh3>\";\n    html += \"<pre class='term'><code>cd color-analytics\\ndocker compose build<\u002Fcode><\u002Fpre>\";\n    html += \"<p>Then, once per PowerShell session:<\u002Fp>\";\n    html += \"<pre class='term'><code>$env:POSTGRES_PASSWORD = \\\"&lt;your db password&gt;\\\"<\u002Fcode><\u002Fpre>\";\n    html += \"<p><code>DB_HOST<\u002Fcode> is already wired to <code>host.docker.internal<\u002Fcode> in <code>docker-compose.yml:13<\u002Fcode>, so no host configuration is needed if your database runs on the machine you're running Docker on. <code>POSTGRES_PASSWORD<\u002Fcode> is not declared in the compose file's <code>environment:<\u002Fcode> block, so it has to be forwarded explicitly on each run (see the translation rule).<\u002Fp>\";\n\n    html += \"<h3>The translation rule<\u002Fh3>\";\n    html += \"<p>Everywhere in this document you see<\u002Fp>\";\n    html += \"<pre class='term'><code>cli.py &lt;command&gt; &lt;args&gt;<\u002Fcode><\u002Fpre>\";\n    html += \"<p>run it from the <code>color-analytics<\u002Fcode> directory as<\u002Fp>\";\n    html += \"<pre class='term'><code>docker compose run --rm -e POSTGRES_PASSWORD=$env:POSTGRES_PASSWORD `\\n    pipeline python cli.py &lt;command&gt; &lt;args&gt;<\u002Fcode><\u002Fpre>\";\n    html += \"<p><code>--rm<\u002Fcode> removes the container after the command exits, so repeated runs don't leave a graveyard of stopped containers behind. The backtick at the end of the first line is PowerShell's line continuation — write it as one line if you prefer.<\u002Fp>\";\n\n    html += \"<h3>What the compose file already handles for you<\u002Fh3>\";\n    html += \"<ul>\"\n      + \"<li>The repo is mounted at <code>/app<\u002Fcode>, so anything written to <code>outputs/…<\u002Fcode> inside the container appears in <code>color-analytics/…/outputs/<\u002Fcode> on the host.<\u002Fli>\"\n      + \"<li>Product images are mounted at <code>/app/images<\u002Fcode> from the sibling <code>03_images/<\u002Fcode> tree (<code>docker-compose.yml:11<\u002Fcode>).<\u002Fli>\"\n      + \"<li>GPU access is passed through (<code>docker-compose.yml:20-24<\u002Fcode>) — required for <code>segment<\u002Fcode> (YOLO inference) and <code>compute-drift<\u002Fcode> (CUDA Sinkhorn).<\u002Fli>\"\n      + \"<\u002Ful>\";\n\n    html += \"<h3>Two worked examples<\u002Fh3>\";\n    html += \"<p class='muted' style='margin:0 0 8px;font-size:.9em'>Brand-required stage:<\u002Fp>\";\n    html += \"<pre class='term'><code>docker compose run --rm -e POSTGRES_PASSWORD=$env:POSTGRES_PASSWORD `\\n    pipeline python cli.py segment nike<\u002Fcode><\u002Fpre>\";\n    html += \"<p class='muted' style='margin:0 0 8px;font-size:.9em'>Multi-brand deliverable:<\u002Fp>\";\n    html += \"<pre class='term'><code>docker compose run --rm -e POSTGRES_PASSWORD=$env:POSTGRES_PASSWORD `\\n    pipeline python cli.py archetypes<\u002Fcode><\u002Fpre>\";\n\n    html += \"<h3>Running without Docker<\u002Fh3>\";\n    html += \"<p>If you have the CUDA + Python stack installed locally, the same <code>python cli.py &lt;command&gt; &lt;args&gt;<\u002Fcode> works from <code>color-analytics<\u002Fcode> with <code>$env:POSTGRES_PASSWORD<\u002Fcode> and <code>$env:DB_HOST<\u002Fcode> set in your shell. Docker is the default because reproducing that stack from scratch is the harder half of the setup.<\u002Fp>\";\n\n    rootEl.innerHTML = html;\n    const renderInto = async (key,def)=>{\n      const host = rootEl.querySelector(\".seq[data-seq='\"+key+\"']\");\n      if(!host) return;\n      try{ const {svg} = await mermaid.render('rseq_'+key, def); host.innerHTML = svg; host.__mmd = def; }\n      catch(e){ host.textContent = String(e&&e.message?e.message:e); }\n    };\n    await renderInto('legend', legend);\n    for(const key of Object.keys(flows)){ await renderInto('dia-'+key, flows[key]); }\n    requestAnimationFrame(()=>{\n      const ref = rootEl.querySelector(\".seq[data-seq='dia-data_prep'] svg\");\n      const lg = rootEl.querySelector(\".seq[data-seq='legend'] svg\");\n      if(ref && lg && ref.viewBox.baseVal.width){\n        const scale = ref.getBoundingClientRect().width / ref.viewBox.baseVal.width;\n        lg.style.maxWidth='none';\n        lg.style.width = (lg.viewBox.baseVal.width*scale)+'px';\n        lg.style.height='auto';\n      }\n    });\n  }\n\n  renderVals(){ return { root: this.root }; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
